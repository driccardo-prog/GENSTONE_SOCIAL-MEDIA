              letter-spacing="-0.02em">5</text>
        <text x="220.0" y="920" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="32" fill="#282B2A" text-anchor="start"
              letter-spacing="0">Tu casa nunca se queda sin energía.</text>
