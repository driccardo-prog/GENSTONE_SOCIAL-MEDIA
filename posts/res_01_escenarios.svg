<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FFFFFF"/>
  <text x="540.0" y="180" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="24" fill="#68D38E" text-anchor="middle"
        letter-spacing="0.22em">RESPALDO QUE NO FALLA — 01 / 06</text>
  
        <text x="540.0" y="380" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="92" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">Incluso en</text>
        <text x="540.0" y="490" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="92" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">los escenarios</text>
        <text x="540.0" y="600" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="92" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">más exigentes.</text>
  
        <text x="540.0" y="790" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">Cortes largos, picos de consumo,</text>
        <text x="540.0" y="844" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">demanda continua. Genstone responde.</text>
