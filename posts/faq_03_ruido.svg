        <text x="90" y="852" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="32" fill="#282B2A"
              letter-spacing="0">El gabinete está diseñado con aislación acústica</text>
        <text x="90" y="904" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="32" fill="#282B2A"
              letter-spacing="0">para que funcione sin molestar a tu casa ni a</text>
        <text x="90" y="956" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
