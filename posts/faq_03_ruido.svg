  <line x1="90" y1="200" x2="990" y2="200" stroke="#173B2E" stroke-width="1.5"/>

  
        <text x="90" y="420" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="64" fill="#173B2E"
              letter-spacing="-0.015em">¿Hace mucho</text>
        <text x="90" y="498" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="64" fill="#173B2E"
              letter-spacing="-0.015em">ruido?</text>

  <line x1="90" y1="616" x2="990" y2="616" stroke="#68D38E" stroke-width="1.5"/>

  
        <text x="90" y="696" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="32" fill="#282B2A"
              letter-spacing="0">No. Genstone opera a ≤ 65 dB(A) — más bajo que</text>
        <text x="90" y="748" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="32" fill="#282B2A"
