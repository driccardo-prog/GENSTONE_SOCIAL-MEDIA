              letter-spacing="0">tus vecinos.</text>

  <circle cx="480.0" cy="1170" r="4.0" fill="#B6B6B6"/><circle cx="504.0" cy="1170" r="4.0" fill="#B6B6B6"/><circle cx="528.0" cy="1170" r="4.0" fill="#173B2E"/><circle cx="552.0" cy="1170" r="4.0" fill="#B6B6B6"/><circle cx="576.0" cy="1170" r="4.0" fill="#B6B6B6"/><circle cx="600.0" cy="1170" r="4.0" fill="#B6B6B6"/>

