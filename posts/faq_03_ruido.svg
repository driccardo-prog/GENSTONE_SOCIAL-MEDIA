<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FFFFFF"/>

  <text x="540.0" y="180" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="24" fill="#68D38E" text-anchor="middle"
        letter-spacing="0.22em">PREGUNTAS FRECUENTES — 03 / 06</text>

  
        <text x="540.0" y="370" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="96" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">¿Hace mucho</text>
        <text x="540.0" y="480" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="96" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">ruido?</text>

  <text x="540.0" y="660" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="26" fill="#282B2A" text-anchor="middle"
        letter-spacing="0.22em">COMPARACIÓN</text>

  
        <text x="540.0" y="720" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="46" fill="#68D38E" text-anchor="middle"
              letter-spacing="-0.015em">65 dB(A)<tspan font-weight="300" font-size="32" fill="#173B2E" dx="20">= Una conversación normal.</tspan></text>
        <text x="540.0" y="808" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="46" fill="#B6B6B6" text-anchor="middle"
              letter-spacing="-0.015em">80 dB(A)<tspan font-weight="300" font-size="32" fill="#282B2A" dx="20">= Tráfico intenso.</tspan></text>
        <text x="540.0" y="896" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="46" fill="#B6B6B6" text-anchor="middle"
              letter-spacing="-0.015em">90 dB(A)<tspan font-weight="300" font-size="32" fill="#282B2A" dx="20">= Generadores comunes.</tspan></text>

  <text x="540.0" y="1064" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="26" fill="#282B2A" text-anchor="middle"
        letter-spacing="0.22em">IMPLICACIÓN</text>
  <text x="540.0" y="1122" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="38" fill="#173B2E" text-anchor="middle"
        letter-spacing="-0.015em">Genstone funciona al lado tuyo</text>
  <text x="540.0" y="1172" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="38" fill="#173B2E" text-anchor="middle"
        letter-spacing="-0.015em">sin molestarte.</text>
