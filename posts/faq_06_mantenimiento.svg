<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FFFFFF"/>

  <text x="540.0" y="180" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
        font-size="24" fill="#68D38E" text-anchor="middle"
        letter-spacing="0.22em">PREGUNTAS FRECUENTES — 06 / 06</text>

  
        <text x="540.0" y="450.0" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="96" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">¿Qué mantenimiento</text>
        <text x="540.0" y="560.0" font-family="Neue Haas Grotesk Display Pro" font-weight="500"
              font-size="96" fill="#173B2E" text-anchor="middle"
              letter-spacing="-0.02em">necesita?</text>

  
        <text x="540.0" y="880" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">Mantenimiento programado: cambio de aceite, filtro</text>
        <text x="540.0" y="934" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">de aire y bujías según horas de uso.</text>
        <text x="540.0" y="988" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0"></text>
        <text x="540.0" y="1042" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">El monitoreo 24/7 te avisa cuando toca cada</text>
        <text x="540.0" y="1096" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">servicio. Nuestra red técnica se encarga del</text>
        <text x="540.0" y="1150" font-family="Neue Haas Grotesk Display Pro" font-weight="300"
              font-size="36" fill="#282B2A" text-anchor="middle"
              letter-spacing="0">resto, en todo el país.</text>
